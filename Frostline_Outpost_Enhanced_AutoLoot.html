function sphereMesh(){

const rightScreen=[.86,-.51],upScreen=[-.51,-.86];
function input(){
 let x=0,y=0;
 if(keys.has('a')||keys.has('arrowleft'))x--;
 if(keys.has('d')||keys.has('arrowright'))x++;
 if(keys.has('w')||keys.has('arrowup'))y--;
 if(keys.has('s')||keys.has('arrowdown'))y++;
 if(pointer.active){x+=pointer.dx/58;y+=pointer.dy/58}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 return {x:x*rightScreen[0]-y*upScreen[0],z:x*rightScreen[1]-y*upScreen[1],power:Math.min(1,l)}
}
let ac=null,noiseBuffer=null;
function initSound(){
 try{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
   noiseBuffer=ac.createBuffer(1,Math.round(ac.sampleRate*.42),ac.sampleRate);
   let d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  }
  if(ac.state==='suspended')ac.resume();
 }catch(e){ac=null}
}
function tone(f,d,type='triangle',volume=.13,fend=f){
 if(!ac)return;
 try{let st=ac.currentTime,osc=ac.createOscillator(),g=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(f,st);osc.frequency.exponentialRampToValueAtTime(Math.max(25,fend),st+d);g.gain.setValueAtTime(volume,st);g.gain.exponentialRampToValueAtTime(.0001,st+d);osc.connect(g);g.connect(ac.destination);osc.start(st);osc.stop(st+d+.01)}catch(e){}
}
function noise(d,volume=.1,cutoff=1200){
 if(!ac||!noiseBuffer)return;
 try{let st=ac.currentTime,src=ac.createBufferSource(),filter=ac.createBiquadFilter(),g=ac.createGain();src.buffer=noiseBuffer;filter.type='lowpass';filter.frequency.value=cutoff;g.gain.setValueAtTime(volume,st);g.gain.exponentialRampToValueAtTime(.0001,st+d);src.connect(filter);filter.connect(g);g.connect(ac.destination);src.start(st);src.stop(st+Math.min(.4,d))}catch(e){}
}
function sfx(which){
 if(!ac)return;
 if(which==='shot'){noise(.17,.12,2500);tone(190,.13,'sawtooth',.055,70)}
 else if(which==='hit'){noise(.12,.12,740);tone(110,.09,'triangle',.07,48)}
 else if(which==='hurt'){noise(.16,.13,520);tone(290,.27,'sawtooth',.1,85)}
 else if(which==='bear'){tone(110,.58,'sawtooth',.075,49);noise(.45,.045,430)}
 else if(which==='foot'){noise(.07,.035,580)}
 else if(which==='pick'){tone(520,.09,'sine',.045,900)}
 else if(which==='coin'){tone(700,.22,'sine',.105,1100);setTimeout(()=>tone(1000,.2,'sine',.07,1400),90)}
 else if(which==='upgrade'){tone(350,.28,'triangle',.13,690);setTimeout(()=>tone(680,.28,'sine',.1,1050),120)}
 else if(which==='fail'){tone(250,.2,'triangle',.09,170)}
 else if(which==='death'){tone(310,.5,'sawtooth',.13,48);noise(.35,.1,450)}
 else if(which==='unlock'){tone(370,.6,'sine',.13,1000);setTimeout(()=>tone(700,.48,'triangle',.12,1450),100)}
 else if(which==='sweep'){tone(410,.2,'sine',.043,850);noise(.16,.03,1120)}
 else if(which==='meat'){tone(385,.13,'sine',.045,585)}
 else if(which==='drop'){noise(.16,.075,340);tone(145,.18,'triangle',.07,83)}
 else if(which==='build'){tone(240,.48,'triangle',.13,700);tone(560,.62,'sine',.12,1100)}
}

function giveLoot(amount,x,z,kind='bear'){

  if(bagFullWarn<=0){notice('กระเป๋าเต็ม! กลับฐานไปขาย',hero.x,hero.z,'#ffd392',2);bagFullWarn=3}
  return 0
 }
 let value=0;
 for(let i=0;i<granted;i++){
  const item=LOOT[kind==='cache'? (Math.random()<.5?3:Math.floor(Math.random()*4)) : (Math.random()<.5?1:2)];
  value+=item.value;
  if(i<16)lootFlights.push({x:x+rand(-1,1),z:z+rand(-1,1),targetX:hero.x,targetZ:hero.z,elapsed:-i*.045,life:.85,color:item.color,kind});
 }

 notice('เก็บอัตโนมัติ +'+granted+' ชิ้น',x,z,'#dbffc8',1.8);

}

  if(inside&&!padInside[p.type]){
   if(p.type==='sell'){
    if(state.bag>0){
     let items=state.bag,earned=state.bagValue;
     state.coins+=earned;state.bag=0;state.bagValue=0;

     bannerEvent('sell','ขายของสำเร็จ!','+'+earned+' เหรียญ  •  '+items+' ชิ้น','#94f7be');
     notice('+'+earned+' 🪙',p.x,p.z,'#ffedb3',2.7);sfx('coin');save();
    }else{notice('ไม่มีของขาย',p.x,p.z,'#c5e6ea',1.55);effects.fail=1;sfx('fail')}
   }else if(p.type==='upgrade'){

     state.coins-=cost;state.level++;effects.upgrade=2.7;hero.boost=2.2;
     wave(p.x,p.z,0xffc36b,5);particles(hero.x,1.7,hero.z,palette.gold,38);

     notice('★ LEVEL UP ★',p.x,p.z,'#ffe9bb',2.6);sfx('upgrade');save();
    }else{
     bannerEvent('fail',state.level>=50?'ปืนระดับสูงสุดแล้ว':'เหรียญยังไม่พอ',state.level>=50?'MAX LEVEL':'ขาดอีก '+Math.max(0,cost-state.coins)+' เหรียญ','#ffb7a9');
     effects.fail=1.1;wave(p.x,p.z,0xff7373,2);sfx('fail')
    }
   }else if(p.type==='gate'&&!state.gate){
    if(state.coins>=60){
     state.coins-=60;state.gate=true;effects.unlock=2.5;
     wave(p.x,p.z,0x91ffbe,6);particles(p.x,2.3,13,palette.green,46);
     bannerEvent('unlock','เปิดประตูสำเร็จ!','ปลดล็อกพื้นที่ใหม่','#a9ffd3');
     notice('GATE OPEN!',0,13,'#d0ffcf',3);sfx('unlock');save();
    }else{
     bannerEvent('fail','ประตูยังล็อก','ขาดอีก '+(60-state.coins)+' เหรียญ','#ffb7a9');
     effects.fail=1.1;wave(p.x,p.z,0xff7373,2);sfx('fail')
    }
   }
  }
  padInside[p.type]=inside;
 }
}
function unloadUpdate(dt){
 // Walking away stops NEW throws. In-flight meat finishes landing and is never lost.
 const inside=Math.hypot(hero.x-BUILD.x,hero.z-BUILD.z)<BUILD.radius;
 hero.unloading=inside&&freeMeat()>0&&effects.buildComplete<=0&&state.buildStored+meatReserved<buildGoal();
 hero.unloadPose+=(Number(hero.unloading)-hero.unloadPose)*Math.min(1,dt*10);
 hero.unloadSwing=Math.max(0,hero.unloadSwing-dt*4.3);
 if(hero.unloading){
  depositInterval-=dt;
  if(depositInterval<=0){
   const available=freeMeat();
   const remaining=buildGoal()-state.buildStored-meatReserved;
   // Batch size is adaptive so a huge inventory never takes forever to unload.
   const batch=available<20?1:available<100?3:available<400?7:15;
   const n=Math.min(available,remaining,batch);
   if(n>0){
    meatReserved+=n;
    const offset=orient(hero.x,hero.z,hero.yaw,0,1.02);
    const tier=meatLayers(displayMeat);
    depositFlights.push({n,elapsed:0,duration:.48,x:offset[0],y:1.45+tier*.22,z:offset[1],
      toX:BUILD.dropX+rand(-.8,.8),toY:1.2,toZ:BUILD.dropZ+rand(-.65,.65)});
    hero.unloadSwing=1;
    depositInterval=.16;
   }
  }
 }else depositInterval=0;
 for(let i=depositFlights.length-1;i>=0;i--){
  const f=depositFlights[i]; f.elapsed+=dt;
  if(f.elapsed>=f.duration){
   // Only commit inventory/progress when the carried meat physically lands.
   meatReserved-=f.n;
   state.meat=Math.max(0,state.meat-f.n);
   state.buildStored+=f.n;
   particles(f.toX,f.toY,f.toZ,0xd98f79,Math.min(9,f.n+3));
   if(i%2===0)sfx('drop');
   depositFlights.splice(i,1);
   if(state.buildStored>=buildGoal()){
    const finished=state.fortLevel+1;
    state.fortLevel=Math.min(999,state.fortLevel+1);
    state.buildStored=0;
    effects.buildComplete=3.6;
    hero.boost=2.2;
    wave(BUILD.fortX,BUILD.fortZ,0x88f5bf,7);
    particles(BUILD.fortX,3,BUILD.fortZ,0xffdfa0,46);
    bannerEvent('build','สร้างป้อมสำเร็จ!','OUTPOST  Lv.'+finished,'#a9ffd3');
    notice('★ ป้อม Lv.'+finished+' สำเร็จ ★',BUILD.fortX,BUILD.fortZ,'#d6ffce',3.5);
    sfx('build');
    depositInterval=.8;
   }
   save();
  }
 }
 displayMeat+=(freeMeat()-displayMeat)*Math.min(1,dt*11);
}
function heroUpdate(dt){
 const inp=input();let speed=7.2;
 if(inp.power>.01){
  let nx=clamp(hero.x+inp.x*dt*speed,-34,34),nz=clamp(hero.z+inp.z*dt*speed,-45,34);
  if(!state.gate&&hero.z<=12.75&&nz>12.75)nz=12.75;
  if(!state.gate&&hero.z>12.75&&nz<12.75)nz=12.75;
  hero.x=nx;hero.z=nz;
  hero.walk+=dt*12;hero.step-=dt;if(hero.step<=0){hero.step=.36;sfx('foot')}
 }
 hero.hit=Math.max(0,hero.hit-dt*2.3);
 hero.boost=Math.max(0,hero.boost-dt);
 hero.shoot-=dt;
 let target=null,near=16.5;
 for(let b of bears){if(!b.alive)continue;let d=dist(b,hero);if(d<near){near=d;target=b}}
 if(target){
  hero.yaw=Math.atan2(hero.x-target.x,hero.z-target.z);
  if(hero.shoot<=0){
   const p=orient(hero.x,hero.z,hero.yaw,.43,-1.28);
   let dx=target.x-p[0],dz=target.z-p[1],len=Math.hypot(dx,dz)||1;
   bullets.push({x:p[0],y:1.54,z:p[1],vx:dx/len*43,vz:dz/len*43,life:.7,damage:21+(state.level-1)*5,seed:Math.random()});
   hero.shoot=Math.max(.15,.38-(state.level-1)*.008);gunFlash=.13;sfx('shot');
  }
 }else if(inp.power>.08){
  hero.yaw=Math.atan2(-inp.x,-inp.z);
 }
 gunFlash=Math.max(0,gunFlash-dt);
}
function bearsUpdate(dt){
 for(let b of bears){
  if(!b.alive){b.respawn-=dt;if(b.respawn<=0){b.alive=true;b.hp=b.maxHp;b.x=b.homeX+rand(-3,3);b.z=b.homeZ+rand(-2,2);b.attack=0}continue}
  const d=dist(b,hero),safe=Math.hypot(hero.x,hero.z-4)<9.8;
  let chase=d<14&&!safe&&(b.area===0?hero.z< -6:hero.z>13.2);
  b.roar-=dt;if(chase&&b.roar<=0){b.roar=rand(9,18);if(d<11)sfx('bear')}
  let dx=0,dz=0;
  if(chase){dx=hero.x-b.x;dz=hero.z-b.z}
  else{
   b.phase+=dt*.5;
   dx=Math.sin(b.phase)*.7+(b.homeX-b.x)*.085;
   dz=Math.cos(b.phase*.72)*.7+(b.homeZ-b.z)*.085;
  }
  let ll=Math.hypot(dx,dz);if(ll>.001){dx/=ll;dz/=ll}
  if(d>2.0||!chase){
   let speed=(chase?b.speed:1.1)*dt;
   b.x=clamp(b.x+dx*speed,-32,32);
   b.z=clamp(b.z+dz*speed,b.area===0?-44:17,b.area===0?-7:34);
   b.yaw=Math.atan2(-dx,-dz);
   b.walk+=dt*(chase?7:3);
  }
  b.attack-=dt;
  if(chase&&d<2.25&&b.attack<=0){
   b.attack=b.boss?1.05:1.28;
   hero.health-=b.boss?30:b.area?18:13;
   hero.hit=1;particles(hero.x,1.3,hero.z,0xff7c7c,4);
   sfx('hurt');notice('-'+(b.boss?30:b.area?18:13)+' HP',hero.x,hero.z,'#ff8997',.9);
   if(hero.health<=0){respawn()}
  }
 }
}
function bulletsUpdate(dt){
 for(let i=bullets.length-1;i>=0;i--){
  let o=bullets[i];o.x+=o.vx*dt;o.z+=o.vz*dt;o.life-=dt;
  let didHit=false;
  for(let b of bears){
   if(!b.alive)continue;
   if(Math.hypot(o.x-b.x,o.z-b.z)<(b.boss?1.85:1.3)){
    b.hp-=o.damage;particles(o.x,1.5,o.z,0xfef4ba,5);
    notice('-'+o.damage,b.x,b.z,'#ffeaba',.58);sfx('hit');
    if(b.hp<=0)killBear(b);
    didHit=true;break;
   }
  }
  if(didHit||o.life<=0)bullets.splice(i,1);
 }
 // The outpost automatically attracts nearby leftover loot.
 for(let i=pickups.length-1;i>=0;i--){
  let p=pickups[i];p.life-=dt;p.phase+=dt*2;
  let d=dist(p,hero);
  if(d<7&&state.bag<state.maxBag){let speed=Math.min(14,(7.6-d)*3.1);p.x+=(hero.x-p.x)/(d||1)*speed*dt;p.z+=(hero.z-p.z)/(d||1)*speed*dt}
  if(d<3.1&&state.bag<state.maxBag){
   state.bag++;state.bagValue+=p.value;
   lootFlights.push({x:p.x,z:p.z,elapsed:0,life:.5,color:p.color||0xffcd81});
   if(i%3===0)sfx('pick');pickups.splice(i,1);continue
  }
  if(p.life<=0)pickups.splice(i,1)
 }
 // Supply crates get gathered without a button, then refresh over time.
 for(let p of supplies){
  p.phase+=dt;
  if(!p.ready){p.cooldown-=dt;if(p.cooldown<=0)p.ready=true;continue}
  if(Math.hypot(hero.x-p.x,hero.z-p.z)<3.1&&state.bag<state.maxBag){
   let n=giveLoot(p.count,p.x,p.z,'cache');
   if(n>0){p.ready=false;p.cooldown=rand(24,37);sfx('sweep')}
  }
 }
 for(let i=lootFlights.length-1;i>=0;i--){let p=lootFlights[i];p.elapsed+=dt;if(p.elapsed>p.life)lootFlights.splice(i,1)}
 for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=10*dt;p.life-=dt;if(p.life<=0)sparks.splice(i,1)}
 for(let i=messages.length-1;i>=0;i--){messages[i].life-=dt;if(messages[i].life<=0)messages.splice(i,1)}
 for(let i=rings.length-1;i>=0;i--){let p=rings[i];p.age+=dt;if(p.age>p.total)rings.splice(i,1)}
 for(let i=fallen.length-1;i>=0;i--){let p=fallen[i];p.age+=dt;if(p.age>p.duration)fallen.splice(i,1)}
 for(let key of Object.keys(effects))effects[key]=Math.max(0,effects[key]-dt);
 if(banner){banner.life-=dt;if(banner.life<=0)banner=null}
 bagFullWarn=Math.max(0,bagFullWarn-dt);
}

 W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);DPR=Math.min(devicePixelRatio||1,W<650?1.4:1.7);
 for(let c of [world,overlay]){c.width=Math.ceil(W*DPR);c.height=Math.ceil(H*DPR)}

 ctx.setTransform(DPR,0,0,DPR,0,0);

function project(x,y,z){

   const bx=buildHere.x-bw/2,by=buildHere.y+15;
   ctx.fillStyle='rgba(14,36,44,.8)';ctx.beginPath();ctx.roundRect(bx-8,by-30,bw+16,69,10);ctx.fill();
   floatingText(effects.buildComplete>0?'ป้อมเสร็จ!':'ป้อม Lv.'+(state.fortLevel+1),buildHere.x,by-15,
    {size:12,bold:true,color:effects.buildComplete>0?'#aeffd6':'#ffe0cc',outline:false});
   ctx.fillStyle='#233a43';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,5);ctx.fill();
   if(pc>0){ctx.fillStyle=pc===100?'#65ed9d':'#f1a37f';ctx.beginPath();ctx.roundRect(bx,by,bw*pc/100,bh,5);ctx.fill()}
   floatingText(pc+'%  •  '+(effects.buildComplete>0?'DONE':state.buildStored+'/'+buildGoal()),buildHere.x,by+27,{size:12,bold:true,color:'#fff',outline:false});
 }
 if(freeMeat()>0&&Math.hypot(hero.x-BUILD.x,hero.z-BUILD.z)<6.9){
   // Depot is unmistakable through the world-space meat icon and fill bar.
   // A separate label is deliberately avoided to keep the view clear.
 }
 label3D('OUTPOST',-11,4.52,4.2,{size:12,bold:true,color:'#e9fbff'});
 if(state.gate)label3D('ALPHA TERRITORY',-5,3.7,27,{size:12,bold:true,color:'#ffe0cb'});
 // health above hero; no conventional status HUD
 let hp=project(hero.x,3.35+Math.max(0,meatLayers(displayMeat)-5)*.31,hero.z);
 if(hp.visible){healthbar(hp.x,hp.y,66,8,hero.health/hero.maxHealth,hero.health<35?'#ff656c':'#70eda5');floatingText(Math.round(hero.health)+'',hp.x,hp.y-10,{size:10,color:'#e8fff4'})}
 for(let b of bears){if(!b.alive||dist(b,hero)>17)continue;let p=project(b.x,b.boss?5.9:3.55,b.z);if(p.visible)healthbar(p.x,p.y,b.boss?75:52,5,b.hp/b.maxHp,b.boss?'#f28b71':'#eebf7c')}
 // in-world information messages
 for(let m of messages){
  let p=project(m.x,3.65+(m.full-m.life)*1.1,m.z);if(!p.visible)continue;
  ctx.globalAlpha=clamp(m.life/.65,0,1);
  floatingText(m.msg,p.x,p.y,{size:clamp(W*.026,13,19),color:m.color,bold:true});ctx.globalAlpha=1;
 }
 // One big temporary feedback animation for actual actions. No dialogs or pause.
 if(banner){
  let age=banner.duration-banner.life;
  let fade=Math.min(1,age/.22,banner.life/.45);
  let width=Math.min(W-28,390),height=86;
  let bx=W*.5-width*.5, by=Math.min(100,H*.18)+Math.max(0,1-age/.22)*-18;
  ctx.globalAlpha=clamp(fade,0,1);
  ctx.fillStyle='rgba(12,35,47,.84)';
  ctx.strokeStyle=banner.color;ctx.lineWidth=2.4;
  ctx.beginPath();ctx.roundRect(bx,by,width,height,17);ctx.fill();ctx.stroke();
  let icon=banner.type==='sell'?'◉':banner.type==='upgrade'?'★':banner.type==='unlock'?'◆':banner.type==='death'?'✚':'!';
  ctx.fillStyle=banner.color;
  ctx.beginPath();ctx.arc(bx+39,by+42,22+Math.sin(age*14)*2.5,0,TAU);ctx.fill();
  floatingText(icon,bx+39,by+41,{size:26,color:'#173440',bold:true,outline:false});
  floatingText(banner.title,bx+72,by+31,{size:clamp(W*.031,17,22),color:'#fff',bold:true,align:'left',outline:false});
  floatingText(banner.detail,bx+72,by+59,{size:clamp(W*.021,12,15),color:banner.color,align:'left',outline:false});
  ctx.globalAlpha=1;
 }
 // snowfall
 ctx.fillStyle='rgba(244,253,255,.71)';
 for(let snow of screenSnow){
  snow.x+=snow.vx*dt*.1;snow.y+=snow.vy*dt;
  if(snow.y>1.02){snow.y=-.02;snow.x=Math.random()}
  if(snow.x<-.02)snow.x=1.02;
  ctx.globalAlpha=.4+snow.z*.32;
  ctx.beginPath();ctx.arc(snow.x*W,snow.y*H,snow.z*1.2,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(pointer.active){
  const r=58,cx=pointer.x,cy=pointer.y,dx=pointer.dx,dy=pointer.dy;
  ctx.fillStyle='rgba(13,43,60,.22)';ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(cx,cy,r+8,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(196,246,255,.45)';ctx.strokeStyle='rgba(255,255,255,.75)';
  ctx.beginPath();ctx.arc(cx+dx,cy+dy,24,0,TAU);ctx.fill();ctx.stroke();
 }
 let tip=Math.max(0,9-t);if(tip>0){ctx.globalAlpha=Math.min(1,tip/2);floatingText('ลากนิ้วเพื่อเดิน  •  ล่าหมีแล้วส่งเนื้อที่วงแดง',W/2,H-36,{size:clamp(W*.024,11,15),color:'#fff'});ctx.globalAlpha=1}
 if(hero.hit>.01){
  ctx.strokeStyle='rgba(255,74,76,'+(hero.hit*.35)+')';ctx.lineWidth=hero.hit*24;ctx.strokeRect(0,0,W,H)
 }
}
function frameLoop(ms){
 if(!now)now=ms;
 const dt=clamp((ms-now)/1000,0,.035);now=ms;t+=dt;frame++;
 heroUpdate(dt);bearsUpdate(dt);bulletsUpdate(dt);checkPads();unloadUpdate(dt);cameraUpdate(dt);
 render3D();renderUI(dt);
 if(frame%480===0)save();
 requestAnimationFrame(frameLoop)
}
overlay.addEventListener('pointerdown',ev=>{
 if(ev.button!==0&&ev.pointerType==='mouse')return;
 initSound();ev.preventDefault();if(pointer.active)return;
 pointer.active=true;pointer.id=ev.pointerId;pointer.x=ev.clientX;pointer.y=ev.clientY;pointer.dx=pointer.dy=0;
 try{overlay.setPointerCapture(ev.pointerId)}catch(e){}
},{passive:false});
overlay.addEventListener('pointermove',ev=>{
 if(!pointer.active||ev.pointerId!==pointer.id)return;ev.preventDefault();
 let dx=ev.clientX-pointer.x,dy=ev.clientY-pointer.y,m=Math.hypot(dx,dy);
 if(m>58){dx=dx/m*58;dy=dy/m*58}pointer.dx=dx;pointer.dy=dy;
},{passive:false});
function release(ev){if(ev.pointerId!==pointer.id)return;pointer.active=false;pointer.dx=pointer.dy=0;pointer.id=null}
overlay.addEventListener('pointerup',release);overlay.addEventListener('pointercancel',release);overlay.addEventListener('lostpointercapture',release);
window.addEventListener('keydown',ev=>{let k=ev.key.toLowerCase();if('wasd'.includes(k)&&k.length===1||k.startsWith('arrow')){ev.preventDefault();keys.add(k);initSound()};});
window.addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();pointer.active=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('beforeunload',save);
// Diagnostics are available only when explicitly opening the local file with ?test=1.
if(location.search.includes('test=1'))window.__FROSTLINE_TEST__={
 snapshot:()=>({x:hero.x,z:hero.z,meat:state.meat,reserved:meatReserved,level:state.fortLevel,stored:state.buildStored,goal:buildGoal(),bag:state.bag,coins:state.coins,flights:depositFlights.length,unloading:hero.unloading}),
 setPosition:(x,z)=>{hero.x=x;hero.z=z;camera.x=x;camera.z=z},
 addMeat:n=>{harvestMeat(Math.max(0,Math.floor(n)),hero.x,hero.z)},
 quietBears:()=>{for(let b of bears){b.alive=false;b.respawn=1000000}},
 getGlError:()=>gl.getError()
};
notice('ล่าหมี • แบกเนื้อ • ส่งที่วงสีแดง',0,4,'#e6faff',3);
requestAnimationFrame(frameLoop);
})();
