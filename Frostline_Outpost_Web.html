<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#071824" />
<title>FROSTLINE OUTPOST — Survival Game</title>
<style>
:root{--ice:#c8f4ff;--muted:#8caebc;--glass:rgba(8,27,42,.62);--line:rgba(162,218,235,.24);--orange:#ffbf78}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071824;font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;color:#e9faff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(2,9,18,.48) 100%);z-index:2}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .2s}
#hud.hidden{opacity:0}
.hud-left{position:absolute;top:max(16px,env(safe-area-inset-top));left:max(17px,env(safe-area-inset-left));width:202px;display:flex;flex-direction:column;gap:7px}
.stat{display:flex;align-items:center;gap:8px}.stat .ic{width:20px;font-size:15px;text-align:center;text-shadow:0 0 9px #94eaf7}.track{position:relative;flex:1;height:9px;border:1px solid rgba(210,245,252,.22);background:rgba(0,10,20,.66);border-radius:6px;overflow:hidden}.track>i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:6px;transition:width .16s linear}.health i{background:linear-gradient(90deg,#b83a56,#fc6d83)}.warm i{background:linear-gradient(90deg,#3b90e8,#8deaff)}.core i{background:linear-gradient(90deg,#e57e39,#ffd08a)}.stat .value{font-size:10px;color:#bcd9e2;width:30px;text-align:right;font-variant-numeric:tabular-nums}
.hud-top{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;min-width:175px}.phase{font-size:11px;font-weight:800;letter-spacing:3px;color:#d2f5ff;text-shadow:0 1px 15px #000}.clock{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:2px;margin-top:0}.phase-line{height:2px;background:rgba(174,234,250,.19);margin-top:5px;border-radius:6px;overflow:hidden}.phase-line i{height:100%;width:100%;display:block;background:#b8e9ff;transition:width .1s linear}
.hud-right{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(15px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}.resource{height:33px;padding:0 10px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;background:var(--glass);font-size:12px;font-weight:750;backdrop-filter:blur(7px)}.resource .sym{color:#b9eeff;font-size:15px}.resource.wood .sym{color:#a6e6b3}
.tiny{cursor:pointer;pointer-events:auto;background:var(--glass);color:#e2faff;border:1px solid var(--line);width:33px;height:33px;border-radius:9px;font-size:15px;display:grid;place-items:center;backdrop-filter:blur(6px)}.tiny:active{transform:scale(.95)}
#banner{position:absolute;top:22%;left:50%;transform:translate(-50%,0);text-align:center;letter-spacing:3px;font-weight:900;font-size:clamp(19px,4vw,37px);text-shadow:0 4px 24px #000;white-space:nowrap;opacity:0;transition:opacity .25s}#banner small{display:block;font-size:11px;letter-spacing:5px;color:#c5ebfa;margin-top:9px}
#hint{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.35px;color:#d7eff5;text-shadow:0 2px 8px #000;text-align:center;white-space:nowrap;opacity:.93}
#message{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:#e4f5f9;opacity:0;text-shadow:0 1px 8px #000;white-space:nowrap}
#controls{position:fixed;inset:0;pointer-events:none;z-index:5}.dpad{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:max(22px,env(safe-area-inset-left));width:190px;height:180px;pointer-events:none}.ctrl{position:absolute;display:grid;place-items:center;pointer-events:auto;border:1px solid rgba(184,237,250,.3);color:#dcf7ff;background:rgba(8,29,45,.37);border-radius:16px;box-shadow:inset 0 0 18px rgba(130,201,223,.045),0 5px 13px rgba(0,0,0,.13);backdrop-filter:blur(4px);touch-action:none;font-family:inherit;font-weight:800;cursor:pointer}.ctrl.pressed,.ctrl:active{background:rgba(128,220,240,.32);border-color:#bef2ff;transform:scale(.96)}.dpad .ctrl{width:58px;height:58px;font-size:20px}.up{left:66px;top:0}.left{left:4px;top:60px}.down{left:66px;top:120px}.right{left:128px;top:60px}.dpad .hub{position:absolute;left:74px;top:70px;width:42px;height:42px;border:1px solid rgba(184,237,250,.13);border-radius:50%;background:rgba(17,55,71,.15);pointer-events:none}
.actions{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(25px,env(safe-area-inset-bottom));width:224px;height:180px}.actions .ctrl{border-radius:50%;font-size:10px;letter-spacing:1px}.attack{width:90px;height:90px;right:0;bottom:41px;background:rgba(146,52,50,.33);border-color:rgba(252,150,145,.43);font-size:13px!important}.use{width:63px;height:63px;right:98px;bottom:0}.build{width:62px;height:62px;right:105px;bottom:101px}.dash{width:60px;height:60px;right:4px;bottom:127px}.btnicon{display:block;font-size:20px;line-height:24px;letter-spacing:0}.dash .btnicon{font-size:22px}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:26px;background:radial-gradient(ellipse at center,rgba(3,16,26,.50),rgba(2,8,17,.87));backdrop-filter:blur(3px)}#overlay.off{display:none}.panel{text-align:center;max-width:620px;width:100%;padding:26px 15px 30px}.eyebrow{color:#a0dced;letter-spacing:6px;font-size:11px;font-weight:850}.bigtitle{font-size:clamp(42px,8vw,79px);letter-spacing:-3px;font-weight:1000;line-height:.91;margin:19px auto 10px;text-shadow:0 0 44px rgba(146,234,255,.19)}.bigtitle strong{color:#8bddf3}.tag{font-weight:700;letter-spacing:4px;color:#aacad5;font-size:11px;margin:19px auto 25px}.intro{font-size:13px;line-height:1.9;color:#c4dce3;margin:0 auto 26px;max-width:500px}.start{border:1px solid #b9effb;border-radius:12px;background:linear-gradient(135deg,#a8eafa,#57aace);box-shadow:0 0 35px rgba(93,201,237,.25);font-size:14px;letter-spacing:2px;font-weight:900;color:#071e2b;padding:17px 49px;cursor:pointer;min-width:220px}.start:hover{filter:brightness(1.12)}.keys{font-size:11px;margin-top:23px;line-height:2.0;opacity:.78;color:#9cb9c4}.key{display:inline-block;border:1px solid rgba(194,227,242,.22);border-radius:4px;padding:0 5px;color:#e3f9ff;font-weight:750}
#crosshair{position:fixed;left:0;top:0;width:24px;height:24px;border:1px solid rgba(205,246,255,.6);border-radius:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;display:none}#crosshair:before,#crosshair:after{content:'';position:absolute;background:rgba(204,244,250,.8)}#crosshair:before{left:11px;top:-6px;width:1px;height:34px}#crosshair:after{top:11px;left:-6px;height:1px;width:34px}
@media(max-width:740px){.hud-left{width:145px;top:12px;left:9px;gap:5px}.stat .ic{width:13px;font-size:12px}.stat .track{height:7px}.stat .value{font-size:9px;width:24px}.hud-top{top:13px;min-width:95px}.phase{font-size:9px;letter-spacing:1px}.clock{font-size:17px}.phase-line{margin-top:3px}.hud-right{top:12px;right:8px;gap:4px}.resource{height:26px;padding:0 6px;gap:3px;font-size:10px}.resource .sym{font-size:11px}.tiny{width:27px;height:27px;font-size:12px}.dpad{left:9px;bottom:18px;transform:scale(.79);transform-origin:bottom left}.actions{right:7px;bottom:19px;transform:scale(.8);transform-origin:bottom right}#hint{bottom:170px;font-size:10px;max-width:calc(100% - 20px);white-space:normal}.panel{padding:10px}.bigtitle{font-size:clamp(42px,9vw,70px)}.intro{font-size:12px}.keys{font-size:10px}#banner{top:19%}}
@media(max-width:450px){.hud-top{top:69px;min-width:116px}.hud-right .resource{padding:0 5px}.hud-left{width:42vw}.resource{gap:2px}.actions{transform:scale(.73)}.dpad{transform:scale(.72)}}
@media(hover:none){#crosshair{display:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="vignette"></div><div id="crosshair"></div>
<div id="hud" class="hidden">
 <div class="hud-left">
  <div class="stat"><span class="ic" style="color:#ff8791">✚</span><div class="track health"><i id="hpBar"></i></div><span class="value" id="hpNum">100</span></div>
  <div class="stat"><span class="ic" style="color:#8dddff">❄</span><div class="track warm"><i id="warmBar"></i></div><span class="value" id="warmNum">100</span></div>
  <div class="stat"><span class="ic" style="color:#ffca86">◆</span><div class="track core"><i id="coreBar"></i></div><span class="value" id="coreNum">100</span></div>
 </div>
 <div class="hud-top"><div class="phase" id="phaseName">DAY 01</div><div class="clock" id="phaseClock">00:40</div><div class="phase-line"><i id="phaseBar"></i></div></div>
 <div class="hud-right"><div class="resource wood"><span class="sym">♣</span><span id="woodNum">7</span></div><div class="resource"><span class="sym">⬡</span><span id="metalNum">9</span></div><button class="tiny" id="soundBtn" title="Sound">♪</button><button class="tiny" id="pauseBtn" title="Pause">Ⅱ</button></div>
 <div id="banner"></div><div id="hint"></div><div id="message"></div>
</div>
<div id="controls">
 <div class="dpad"><div class="hub"></div><button class="ctrl up" data-key="up" aria-label="Up">▲</button><button class="ctrl left" data-key="left" aria-label="Left">◀</button><button class="ctrl down" data-key="down" aria-label="Down">▼</button><button class="ctrl right" data-key="right" aria-label="Right">▶</button></div>
 <div class="actions"><button class="ctrl attack" data-key="attack" aria-label="Attack"><span><span class="btnicon">⌖</span>FIRE</span></button><button class="ctrl use" data-key="use" aria-label="Interact"><span><span class="btnicon">✦</span>USE</span></button><button class="ctrl build" data-key="build" aria-label="Build turret"><span><span class="btnicon">⌂</span>BUILD</span></button><button class="ctrl dash" data-key="dash" aria-label="Dash"><span><span class="btnicon">➜</span>DASH</span></button></div>
</div>
<div id="overlay"><div class="panel"><div class="eyebrow">SURVIVAL // SINGLE FILE</div><div class="bigtitle">FROSTLINE<br><strong>OUTPOST</strong></div><div class="tag">DEFEND THE LAST LIGHT</div><p class="intro" id="overlayText">เอาชีวิตรอดในพายุหิมะ • เก็บไม้และเศษเหล็ก • เติมพลังฐาน<br>สร้างป้อมปืนและป้องกันฝูงสัตว์ร้ายยามค่ำคืน</p><button id="startBtn" class="start">START SURVIVAL</button><div class="keys">เคลื่อนที่ <span class="key">W A S D</span> / <span class="key">↑ ← ↓ →</span> &nbsp; ยิง <span class="key">คลิก</span> / <span class="key">F</span><br>เก็บ/ซ่อม <span class="key">E</span> &nbsp; สร้างป้อม <span class="key">B</span> &nbsp; พุ่งหลบ <span class="key">SPACE</span> &nbsp; หยุด <span class="key">P</span></div></div></div>
<script>
(()=>{'use strict';
// Independent standalone HTML interpretation of the Frostline Outpost concept.
// No asset files, frameworks, internet or local PowerShell installation required.
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const UI={overlay:$('overlay'),overlayText:$('overlayText'),startBtn:$('startBtn'),hud:$('hud'),phaseName:$('phaseName'),phaseClock:$('phaseClock'),phaseBar:$('phaseBar'),hpBar:$('hpBar'),hpNum:$('hpNum'),warmBar:$('warmBar'),warmNum:$('warmNum'),coreBar:$('coreBar'),coreNum:$('coreNum'),woodNum:$('woodNum'),metalNum:$('metalNum'),hint:$('hint'),message:$('message'),banner:$('banner'),pause:$('pauseBtn'),sound:$('soundBtn')};
const TWO=Math.PI*2,TAU=TWO,WORLD={w:3000,h:2300},DAY_LEN=39,NIGHT_LEN=46,CORE={x:0,y:0,r:54};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),sq=(x,y)=>x*x+y*y;
const seedRand=(seed)=>()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};
const rand=seedRand(103083);const random=(a,b)=>a+(b-a)*rand();
let W=0,H=0,DPR=1,time=0,last=0,frame=0,mode='menu',paused=false,phase='day',phaseTime=DAY_LEN,day=1,spawnTime=2,score=0,kills=0,best=0,storm=0,shake=0,wood=7,metal=9,weaponLevel=1,nearby=null,flash=0,nightKills=0,shootHeld=false,audio=null,soundOn=false;
let cam={x:0,y:0},player={x:100,y:70,vx:0,vy:0,r:18,face:0,hp:100,warm:100,fireCD:0,hitCD:0,dashCD:0,dashTime:0,dashX:0,dashY:0,step:0},generator={hp:230,maxHp:230,fuel:90},objects=[],decor=[],snow=[],enemies=[],bullets=[],turrets=[],particles=[],loot=[],floating=[];
const keys=new Set(),vkeys=new Set(),pointer={x:0,y:0,active:false,down:false};
let bannerTimeout=0,messageTimeout=0,beginSummary='';
function resize(){const rect=cvs.getBoundingClientRect();W=rect.width;H=rect.height;DPR=Math.min(devicePixelRatio||1,(W<740?1.7:2));cvs.width=Math.max(1,Math.floor(W*DPR));cvs.height=Math.max(1,Math.floor(H*DPR));ctx.setTransform(DPR,0,0,DPR,0,0);makeSnow();}
window.addEventListener('resize',resize,{passive:true});
function makeSnow(){snow=Array.from({length:W<700?90:185},()=>({x:Math.random()*W,y:Math.random()*H,z:rnd(.4,2.2),s:rnd(35,80)}));}
function makeWorld(){objects=[];decor=[];const area=(x,y,pad=70)=>Math.abs(x)<WORLD.w/2-pad && Math.abs(y)<WORLD.h/2-pad;
 for(let i=0;i<160;i++){let x=random(-WORLD.w/2+90,WORLD.w/2-90),y=random(-WORLD.h/2+90,WORLD.h/2-90);if(sq(x,y)<210*210)continue;objects.push({type:'pine',x,y,r:random(21,34),size:random(.75,1.25),hp:2,alive:true});}
 for(let i=0;i<78;i++){let x=random(-WORLD.w/2+70,WORLD.w/2-70),y=random(-WORLD.h/2+70,WORLD.h/2-70);if(sq(x,y)<185*185)continue;objects.push({type:'crate',x,y,r:18,size:random(.85,1.2),hp:1,alive:true});}
 for(let i=0;i<58;i++){let x=random(-WORLD.w/2+70,WORLD.w/2-70),y=random(-WORLD.h/2+70,WORLD.h/2-70);if(sq(x,y)<185*185)continue;objects.push({type:'rock',x,y,r:random(14,28),size:random(.8,1.5),hp:1000,alive:true});}
 for(let i=0;i<1400;i++){let x=random(-WORLD.w/2,WORLD.w/2),y=random(-WORLD.h/2,WORLD.h/2);decor.push({x,y,kind:rand()<.17?1:0,rot:random(0,TWO),s:random(1.5,7)});}
 for(let i=0;i<7;i++){let a=i*TWO/7+.28,rad=300+random(-35,50);objects.push({type:i%3===0?'crate':'pine',x:Math.cos(a)*rad,y:Math.sin(a)*rad,r:22,size:1.05,hp:1,alive:true});}
 }
function reset(){time=0;frame=0;paused=false;mode='game';phase='day';phaseTime=DAY_LEN;day=1;spawnTime=2;score=0;kills=0;nightKills=0;storm=0;shake=0;wood=7;metal=9;weaponLevel=1;flash=0;enemies=[];bullets=[];turrets=[];particles=[];loot=[];floating=[];generator.hp=generator.maxHp;generator.fuel=90;player={x:103,y:90,vx:0,vy:0,r:18,face:-.6,hp:100,warm:100,fireCD:0,hitCD:0,dashCD:0,dashTime:0,dashX:0,dashY:0,step:0};cam.x=0;cam.y=0;makeWorld();UI.hud.classList.remove('hidden');UI.overlay.classList.add('off');UI.pause.textContent='Ⅱ';banner('DAY 01','GATHER • BUILD • SURVIVE');hint('');message('');updateUI();}
function banner(main,sub=''){UI.banner.innerHTML=escapeHTML(main)+(sub?'<small>'+escapeHTML(sub)+'</small>':'');bannerTimeout=3;UI.banner.style.opacity='1';}
function message(t){UI.message.textContent=t;messageTimeout=t?2.4:0;UI.message.style.opacity=t?'1':'0';}
function hint(t){UI.hint.textContent=t;}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sound(freq=200,length=.1,type='sine',vol=.028){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(freq*.64,30),t+length);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+length);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+length+.005);}catch(e){soundOn=false;}}
function squish(x,y,r){return Math.hypot(x,y)<r}
function worldToScreen(x,y){return{x:x-cam.x+W/2,y:y-cam.y+H/2}}
function addParticle(x,y,color,count=5,speed=95){if(particles.length>400)return;for(let i=0;i<count;i++){let a=rnd(0,TWO),s=rnd(speed*.3,speed);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.35,.88),max:1,r:rnd(2,5),color});}}
function floatText(x,y,text,color='#ddf8ff'){floating.push({x,y,text,life:1.1,color});if(floating.length>32)floating.shift();}
function harvest(){if(mode!=='game'||paused)return;let nearBase=Math.hypot(player.x,player.y)<125;let target=null,min=78;
 for(const o of objects){if(!o.alive||o.type==='rock')continue;let d=dist(player,o);if(d<min){target=o;min=d}}
 if(target){target.hp--;player.face=Math.atan2(target.y-player.y,target.x-player.x);addParticle(target.x,target.y,target.type==='pine'?'#b5f9d7':'#c8cddd',8,130);if(target.hp<=0){target.alive=false;if(target.type==='pine'){wood+=3+Math.floor(Math.random()*2);floatText(target.x,target.y,'+ WOOD','#95f4ac');}else{metal+=4+Math.floor(Math.random()*3);floatText(target.x,target.y,'+ SCRAP','#f4d3a1');}sound(290,.13,'triangle');score+=5;}else sound(170,.08,'square');updateUI();return;}
 if(nearBase){if(generator.fuel<87&&wood>0){let used=Math.min(3,wood);generator.fuel=Math.min(100,generator.fuel+used*14);wood-=used;addParticle(0,-13,'#ffc47d',16,135);floatText(0,-76,'+ FUEL','#ffcb8f');message('Generator refueled');sound(490,.16,'triangle');}
 else if(generator.hp<generator.maxHp-1&&metal>=3){metal-=3;generator.hp=Math.min(generator.maxHp,generator.hp+30);floatText(0,-70,'+ REPAIRED','#92e8f7');message('Outpost repaired');sound(340,.14,'triangle');}
 else if(player.hp<96 && metal>=3){metal-=3;player.hp=Math.min(100,player.hp+28);floatText(player.x,player.y-34,'+ HEALED','#ff9eaa');message('First aid used');sound(590,.13,'sine');}
 else{message(generator.fuel<85?'Need wood to refuel':'Harvest wood / scrap nearby');}updateUI();return;}
 message('Move close to a tree, crate or generator');
}
function buildTurret(){if(mode!=='game'||paused)return;if(Math.hypot(player.x,player.y)>285){message('Build near the outpost');return;}if(turrets.length>=7){message('Turret limit reached');return;}if(metal<9||wood<4){message('Requires 9 scrap + 4 wood');return;}
 const offset=turrets.length;let a=Math.atan2(player.y,player.x),r=195+24*(offset%2),x=Math.cos(a)*r,y=Math.sin(a)*r;if(turrets.some(t=>sq(t.x-x,t.y-y)<85*85)){a+=.5+offset*.2;x=Math.cos(a)*r;y=Math.sin(a)*r;}
 turrets.push({x,y,a:a+Math.PI,fireCD:.5,flash:0,hp:100});metal-=9;wood-=4;addParticle(x,y,'#a4eaff',20,175);floatText(x,y-42,'TURRET ONLINE','#b8f8ff');sound(610,.35,'sawtooth',.014);shake=4;updateUI();}
function upgradeWeapon(){if(Math.hypot(player.x,player.y)>135){message('Upgrade at the generator');return;}let cost=14+weaponLevel*7;if(metal<cost){message('Upgrade requires '+cost+' scrap');return;}if(weaponLevel>=5){message('Weapon fully upgraded');return;}metal-=cost;weaponLevel++;addParticle(player.x,player.y,'#78ddf8',20,150);floatText(player.x,player.y-35,'WEAPON LV '+weaponLevel);updateUI();}
function dash(){if(mode!=='game'||paused||player.dashCD>0)return;let x=(isDown('right')?1:0)-(isDown('left')?1:0),y=(isDown('down')?1:0)-(isDown('up')?1:0);if(!x&&!y){x=Math.cos(player.face);y=Math.sin(player.face);}let l=Math.hypot(x,y)||1;player.dashX=x/l;player.dashY=y/l;player.dashTime=.16;player.dashCD=3.1;addParticle(player.x,player.y,'#a1ecff',13,130);sound(320,.2,'triangle');}
function isDown(key){return vkeys.has(key)||keys.has(key)}

function enemySpawn(){if(enemies.length>110)return;let a=rnd(0,TWO),r=rnd(630,850),x=Math.cos(a)*r,y=Math.sin(a)*r;if(sq(player.x-x,player.y-y)<320*320){a+=Math.PI*.6;x=Math.cos(a)*r;y=Math.sin(a)*r;}x=clamp(x,-WORLD.w/2+45,WORLD.w/2-45);y=clamp(y,-WORLD.h/2+45,WORLD.h/2-45);

 ctx.fillStyle=e.elite?'#3b6d82':'#607b88';ctx.beginPath();ctx.ellipse(0,0,19*s,12*s,0,0,TAU);ctx.fill();ctx.fillStyle=e.elite?'#6b9eb0':'#829ca7';ctx.beginPath();ctx.moveTo(11*s,-12*s);ctx.lineTo(23*s,-10*s);ctx.lineTo(29*s,-4*s);ctx.lineTo(29*s,7*s);ctx.lineTo(15*s,11*s);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(13*s,-9*s);ctx.lineTo(10*s,-23*s);ctx.lineTo(22*s,-12*s);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(17*s,9*s);ctx.lineTo(10*s,19*s);ctx.lineTo(26*s,10*s);ctx.closePath();ctx.fill();drawCircle(22*s,-5*s,2.5,e.elite?'#7ff5ff':'#ffad9b');drawCircle(22*s,5*s,2.5,e.elite?'#7ff5ff':'#ffad9b');ctx.fillStyle='#c4e8e5';ctx.fillRect(27*s,-2*s,5*s,2*s);ctx.restore();if(e.hp<e.maxHp){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(p.x-17,p.y-31,34,4);ctx.fillStyle=e.elite?'#8cecff':'#f19a8d';ctx.fillRect(p.x-17,p.y-31,34*clamp(e.hp/e.maxHp,0,1),4);}}
function drawBullets(){ctx.lineCap='round';for(const b of bullets){const p=worldToScreen(b.x,b.y),pr=worldToScreen(b.px,b.py);ctx.strokeStyle=b.dmg>30?'#ffdb9f':'#a3e7f6';ctx.lineWidth=b.r*1.3;ctx.beginPath();ctx.moveTo(pr.x,pr.y);ctx.lineTo(p.x,p.y);ctx.stroke();drawCircle(p.x,p.y,b.r,'#f5fcff');}}
function drawLoot(){for(const o of loot){let p=worldToScreen(o.x,o.y);drawCircle(p.x,p.y,12,'rgba(248,224,140,.16)');ctx.save();ctx.translate(p.x,p.y);ctx.rotate(time);ctx.strokeStyle='#ffde9f';ctx.lineWidth=2;ctx.strokeRect(-6,-6,12,12);ctx.restore();}}
function drawParticles(){for(const p of particles){let v=worldToScreen(p.x,p.y);ctx.globalAlpha=clamp(p.life*1.5,0,1);drawCircle(v.x,v.y,p.r,p.color);}ctx.globalAlpha=1;for(const f of floating){let p=worldToScreen(f.x,f.y);ctx.globalAlpha=clamp(f.life,0,1);ctx.fillStyle=f.color;ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(f.text,p.x,p.y);}ctx.globalAlpha=1;}
function drawSnow(dt){ctx.fillStyle='#dbf8ff';let wind=(phase==='night'?39:23)*(1+storm*3);for(const s of snow){s.y+=s.s*dt*(.55+storm*.6);s.x+=(wind+s.z*9)*dt;if(s.x>W+10)s.x=-10;if(s.y>H+10){s.y=-10;s.x=rnd(0,W);}ctx.globalAlpha=(.18+s.z*.21)*(phase==='night'?1: .8);drawCircle(s.x,s.y,s.z*.85,'#e9faff');}ctx.globalAlpha=1;
 if(storm>0){ctx.fillStyle='rgba(187,226,239,'+(.06+.10*Math.abs(Math.sin(time*.87)))+')';for(let i=0;i<8;i++){let y=((i*139+time*120)% (H+200))-100;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+70);ctx.lineTo(W,y+76);ctx.lineTo(0,y+6);ctx.fill();}}
}
function draw(dt){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));drawGround();
 const visibleObjs=objects.filter(o=>o.alive&&Math.abs(o.x-cam.x)<W/2+140&&Math.abs(o.y-cam.y)<H/2+160);const queue=[];for(const o of visibleObjs)queue.push({y:o.y,kind:'obj',v:o});for(const t of turrets)queue.push({y:t.y,kind:'turret',v:t});for(const e of enemies)queue.push({y:e.y,kind:'enemy',v:e});queue.push({y:0,kind:'core'},{y:player.y,kind:'player'});queue.sort((a,b)=>a.y-b.y);
 for(const el of queue){if(el.kind==='obj')drawObject(el.v);else if(el.kind==='turret')drawTurret(el.v);else if(el.kind==='enemy')drawEnemy(el.v);else if(el.kind==='core')drawCore();else drawPlayer();}
 drawLoot();drawBullets();drawParticles();ctx.restore();
 if(phase==='night'){ctx.fillStyle='rgba(3,11,31,'+(.21+storm*.11)+')';ctx.fillRect(0,0,W,H);}
 if(generator.fuel<15){let p=worldToScreen(0,0);let grad=ctx.createRadialGradient(p.x,p.y,100,p.x,p.y,400);grad.addColorStop(0,'rgba(13,35,52,0)');grad.addColorStop(1,'rgba(2,9,24,.10)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);}
 drawSnow(dt);if(flash>0){ctx.fillStyle='rgba(255,124,124,'+(flash*.42)+')';ctx.fillRect(0,0,W,H);}
 if(mode==='menu'){ctx.fillStyle='rgba(1,9,17,.25)';ctx.fillRect(0,0,W,H);}
}
function loop(ms){let dt=last?Math.min((ms-last)/1000,.04):.016;last=ms;if(!W||!H)resize();if(mode==='game'&&!paused)update(dt);else{time+=dt;cam.x+=(0-cam.x)*Math.min(1,dt*1.7);cam.y+=(0-cam.y)*Math.min(1,dt*1.7);}draw(dt);requestAnimationFrame(loop);}
function buttonAction(key){if(key==='use')harvest();else if(key==='build')buildTurret();else if(key==='dash')dash();}
const keyMap={w:'up',arrowup:'up',a:'left',arrowleft:'left',s:'down',arrowdown:'down',d:'right',arrowright:'right',f:'attack',j:'attack',e:'use',b:'build',' ':'dash'};
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='p'||k==='escape'){if(!e.repeat)pauseGame();return;}if(k==='u'){if(!e.repeat)upgradeWeapon();return;}if(keyMap[k]){let mapped=keyMap[k];if(!keys.has(mapped)&&!e.repeat)buttonAction(mapped);keys.add(mapped);}},{passive:false});
window.addEventListener('keyup',e=>{let m=keyMap[e.key.toLowerCase()];if(m)keys.delete(m)});window.addEventListener('blur',()=>{keys.clear();vkeys.clear();pointer.down=false;if(mode==='game'&&!paused)pauseGame();});
for(const el of document.querySelectorAll('[data-key]')){const k=el.dataset.key;const release=e=>{vkeys.delete(k);el.classList.remove('pressed');if(e&&el.hasPointerCapture?.(e.pointerId))try{el.releasePointerCapture(e.pointerId)}catch(err){}};el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);el.classList.add('pressed');vkeys.add(k);buttonAction(k);});el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);}
cvs.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;$('crosshair').style.left=e.clientX+'px';$('crosshair').style.top=e.clientY+'px';$('crosshair').style.display='block';});cvs.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0){pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;pointer.down=true;}});window.addEventListener('pointerup',()=>{pointer.down=false;});cvs.addEventListener('pointerleave',()=>{pointer.active=false;$('crosshair').style.display='none';});cvs.addEventListener('contextmenu',e=>e.preventDefault());
UI.pause.addEventListener('click',pauseGame);UI.sound.addEventListener('click',()=>{soundOn=!soundOn;UI.sound.textContent=soundOn?'♫':'♪';if(soundOn)sound(500,.15);});UI.startBtn.addEventListener('click',()=>{if(mode==='game'&&paused){pauseGame();return;}reset();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='game'&&!paused)pauseGame();});
// Supply drops offer both resource types and health in a single quick action.
const originalHarvest=harvest;harvest=function(){if(nearby&&nearby.type==='supply'&&nearby.alive&&dist(player,nearby)<78){nearby.alive=false;wood+=8;metal+=15;player.hp=Math.min(100,player.hp+20);generator.fuel=Math.min(100,generator.fuel+15);addParticle(nearby.x,nearby.y,'#bdf9dc',24,170);floatText(nearby.x,nearby.y-20,'SUPPLY +++','#b1fce0');message('Supply cache opened');sound(650,.32,'triangle');updateUI();}else originalHarvest();};
// Correct DOM action binding: functions are read dynamically at action time.
resize();makeWorld();cam={x:0,y:0};player.x=95;player.y=70;try{best=Number(localStorage.getItem('frostline_outpost_best')||0)}catch(e){}requestAnimationFrame(loop);
})();
