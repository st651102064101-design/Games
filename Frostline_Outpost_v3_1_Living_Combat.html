function workerMove(w,tx,tz,dt,speed=5.3){
 let dx=tx-w.x,dz=tz-w.z,d=Math.hypot(dx,dz);
 if(d>.01){w.yaw=Math.atan2(-dx,-dz);let step=Math.min(d,speed*dt);w.x+=dx/d*step;w.z+=dz/d*step;if(step>.01)w.walk+=dt*11}
 return d;
}
function workersUpdate(dt){
 for(let w of workers){
  w.cool-=dt;w.pickAnim=Math.max(0,(w.pickAnim||0)-dt*2.4);w.dropAnim=Math.max(0,(w.dropAnim||0)-dt*2.1);
  // Workers seek shelter during a raid; cargo stays safely on their backs.
  if(raid.active){
   if(w.target&&w.target.workerTarget===w)w.target.workerTarget=null;
   w.target=null;w.raidFlee=true;
   workerMove(w,WAREHOUSE.x+(w.hue===0x5bc6b5?1:-1),WAREHOUSE.z,dt,7);
   continue;
  }
  if(w.raidFlee){w.raidFlee=false;w.phase=w.carry>0?'return':'seek';w.cool=.5;}

  if(w.phase==='seek'){
   if(w.cool>0)continue;
   let closest=null,best=1e12;
   for(let p of pickups){
    // No worker may steal a bundle actively magnetized toward the player.
    if(p.attract||p.workerTarget||p.count<=0||p.z>12.4)continue;
    let d=dist(w,p);if(d<best){best=d;closest=p}
   }
   if(closest){w.target=closest;closest.workerTarget=w;w.phase='fetch'}
   else w.cool=1.2;
  }else if(w.phase==='fetch'){
   let p=w.target;
   if(!p||!pickups.includes(p)||p.count<=0||p.attract){
    if(p&&p.workerTarget===w)p.workerTarget=null;
    w.target=null;w.phase='seek';w.cool=.2;continue;
   }
   if(workerMove(w,p.x,p.z,dt)<1.18){
    const amount=Math.min(14,p.count);
    w.carry=amount;w.kind=p.kind;w.value=amount*p.unitValue;w.pickAnim=1;
    p.count-=amount;p.workerTarget=null;w.target=null;
    if(p.count<=0)pickups.splice(pickups.indexOf(p),1);
    w.phase='return';w.cool=.23;sfx('pick');
    particles(w.x,.75,w.z,p.color,4);
   }
  }else if(w.phase==='return'){
   if(workerMove(w,WAREHOUSE.x+(w.hue===0x5bc6b5?1:-1),WAREHOUSE.z,dt,5.7)<1.25){
    if(w.kind==='meat')state.warehouseMeat+=w.carry;
    else{state.warehouseGoods+=w.carry;state.warehouseValue+=w.value}
    metric('worker',w.carry);
    notice('คลัง +'+w.carry,w.x,w.z,'#bcfff2',1.2);
    particles(w.x,1,w.z,w.kind==='meat'?0xe38d7d:0xffd49a,8);
    wave(w.x,w.z,0x7de8d0,1);sfx('drop');
    w.carry=0;w.dropAnim=1;w.phase='seek';w.cool=rand(.6,1.6);save();
   }
  }
 }
}

// Spawn a few visible grouped items, rather than granting loot from anywhere on the map.
// Grouping protects mobile FPS even when many bears are killed.
function spawnDrop(kind,amount,x,z,unitValue=12){
 amount=Math.max(0,Math.floor(amount));if(amount<=0)return 0;
 const bundles=kind==='meat'?Math.min(4,Math.max(2,Math.ceil(amount/6))):Math.min(2,Math.ceil(amount/5));
 for(let i=0;i<bundles;i++){
  const count=Math.floor(amount/bundles)+(i<amount%bundles?1:0);
  if(!count)continue;
  let xx=x+rand(-.82,.82),zz=z+rand(-.82,.82);
  // Merge crowded drops instead of deleting resources or spawning unlimited meshes.
  if(pickups.length>=170){
   let nearest=null,best=Infinity;
   for(let p of pickups){
    if(p.kind!==kind||p.unitValue!==unitValue)continue;
    let d=Math.hypot(p.x-xx,p.z-zz);if(d<best){best=d;nearest=p}
   }
   if(nearest){nearest.count+=count;continue}
  }
  pickups.push({kind,count,x:xx,z:zz,unitValue,color:kind==='meat'?0xcb6966:0xffcc81,
   phase:rand(0,TAU),age:0,life:420,speed:0,attract:false});
 }
 return amount;
}

function unloadUpdate(dt){
 // Walking away stops NEW throws. In-flight meat finishes landing and is never lost.
 const inside=Math.hypot(hero.x-BUILD.x,hero.z-BUILD.z)<BUILD.radius;
 hero.unloading=inside&&freeMeat()>0&&effects.buildComplete<=0&&state.buildStored+meatReserved<buildGoal();
 hero.unloadPose+=(Number(hero.unloading)-hero.unloadPose)*Math.min(1,dt*10);
 hero.unloadSwing=Math.max(0,hero.unloadSwing-dt*4.3);
 if(hero.unloading){
  depositInterval-=dt;
  if(depositInterval<=0){
   const available=freeMeat();
   const remaining=buildGoal()-state.buildStored-meatReserved;
   // Batch size is adaptive so a huge inventory never takes forever to unload.
   const batch=available<20?1:available<100?3:available<400?7:15;
   const n=Math.min(available,remaining,batch);
   if(n>0){
    meatReserved+=n;
    const offset=orient(hero.x,hero.z,hero.yaw,0,1.02);
    const tier=meatLayers(displayMeat);
    depositFlights.push({n,elapsed:0,duration:.48,x:offset[0],y:1.45+tier*.22,z:offset[1],
      toX:BUILD.dropX+rand(-.8,.8),toY:1.2,toZ:BUILD.dropZ+rand(-.65,.65)});
    hero.unloadSwing=1;
    depositInterval=.16;
   }
  }
 }else depositInterval=0;
 for(let i=depositFlights.length-1;i>=0;i--){
  const f=depositFlights[i]; f.elapsed+=dt;
  if(f.elapsed>=f.duration){
   // Only commit inventory/progress when the carried meat physically lands.
   meatReserved-=f.n;
   state.meat=Math.max(0,state.meat-f.n);
   state.buildStored+=f.n;
   particles(f.toX,f.toY,f.toZ,0xd98f79,Math.min(9,f.n+3));
   if(i%2===0)sfx('drop');
   depositFlights.splice(i,1);
   if(state.buildStored>=buildGoal()){
    const finished=state.fortLevel+1;
    state.fortLevel=Math.min(999,state.fortLevel+1);metric('fort');
    state.buildStored=0;

    sfx('build');

   continue

  const d=dist(b,hero),safe=Math.hypot(hero.x,hero.z-4)<9.8;
  const reindeer=b.type==='reindeer';
  const chase=b.raid||(!reindeer&&d<14&&!safe&&(b.area===0?hero.z< -6:hero.z>13.2));
  b.roar-=dt;b.ability-=dt;b.charging=Math.max(0,b.charging-dt);
  b.animHit=Math.max(0,(b.animHit||0)-dt);

  if(!reindeer&&chase&&b.roar<=0){b.roar=rand(9,18);if(d<11)sfx('bear')}

   wave(b.x,b.z,b.boss?0xff7777:0xffaf70,2);
   if(d<12)sfx('bear');

  let dx=0,dz=0,targetX=hero.x,targetZ=hero.z;
  if(b.raid){
   if(d>5){targetX=0;targetZ=1.1}else{targetX=hero.x;targetZ=hero.z}

  }else if(reindeer&&d<12){dx=b.x-hero.x;dz=b.z-hero.z}

   dz=Math.cos(b.phase*.72)*.7+(b.homeZ-b.z)*.085;
